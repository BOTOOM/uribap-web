name: API Contract Compatibility

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: BOTOOM/uribap-api
          ref: 70e63a1bac6a46e0595eedf13bb1acfee3973345
          path: backend-contract
      - name: Compare pinned contract with API planning stack
        run: cmp contracts/uribap-api.openapi.json backend-contract/openapi/openapi.json
