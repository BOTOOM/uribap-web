services:
  uribap-login:
    build:
      context: ../..
      dockerfile: identity/login/Dockerfile
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      ZITADEL_API_URL: https://zitadel.edwardiaz.dev
      ZITADEL_SERVICE_USER_TOKEN: ${URIBAP_LOGIN_PAT:?URIBAP_LOGIN_PAT is required}
      NEXT_PUBLIC_BASE_PATH: /uribap
      NEXT_PUBLIC_THEME_LAYOUT: top-to-bottom
      URIBAP_WEB_URL: https://uribap.edwardiaz.dev
      CUSTOM_REQUEST_HEADERS: Host:zitadel.edwardiaz.dev,X-Forwarded-Proto:https
    networks:
      - coolify
    labels:
      traefik.enable: "true"
      traefik.docker.network: coolify
      traefik.http.routers.uribap-login.rule: "Host(`zitadel.edwardiaz.dev`) && (Path(`/uribap`) || PathPrefix(`/uribap/`))"
      traefik.http.routers.uribap-login.entrypoints: https
      traefik.http.routers.uribap-login.tls: "true"
      traefik.http.routers.uribap-login.tls.certresolver: letsencrypt
      traefik.http.routers.uribap-login.priority: "2000"
      traefik.http.routers.uribap-login.service: uribap-login
      traefik.http.routers.uribap-login.middlewares: uribap-login-hosts
      traefik.http.services.uribap-login.loadbalancer.server.port: "3000"
      traefik.http.services.uribap-login.loadbalancer.server.scheme: http
      traefik.http.services.uribap-login.loadbalancer.passhostheader: "true"
      traefik.http.middlewares.uribap-login-hosts.headers.customrequestheaders.X-Zitadel-Instance-Host: zitadel.edwardiaz.dev
      traefik.http.middlewares.uribap-login-hosts.headers.customrequestheaders.X-Zitadel-Public-Host: zitadel.edwardiaz.dev

networks:
  coolify:
    external: true
    name: coolify
